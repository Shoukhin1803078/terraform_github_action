name: Deploy FastAPI App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3     # https://github.com/appleboy/ssh-action predefined action
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            if [ ! -d "terraform_github_action" ]; then
              git clone https://github.com/Shoukhin1803078/terraform_github_action.git
            fi

            cd terraform_github_action

            git pull origin main

            chmod +x start.sh

            ./start.sh



